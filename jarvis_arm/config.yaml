# Jarvis-Arm runtime configuration.
# Secrets (API keys) live in .env, never here. See .env.example.

mode: mock            # mock | hardware   (CLI --hardware overrides)

logging:
  level: INFO
  dir: logs           # every API call / task trace is written here (gitignored)

voice:
  input: mic          # mic | text        (CLI --text overrides)
  wake_word: hey_jarvis
  wake_threshold: 0.3
  sample_rate: 16000
  vad_aggressiveness: 2      # 0-3
  silence_s: 1.2
  max_utterance_s: 10
  convo_timeout_s: 12
  stt_model: whisper-large-v3-turbo
  language: en

tts:
  # Tried in order; first one that works is used for the rest of the session.
  engines: [elevenlabs, piper, espeak, say, print]
  elevenlabs:
    voice_id: pNInz6obpgDQGcFmaJgB
    model_id: eleven_flash_v2_5
    output_format: mp3_44100_128
  piper:
    model_path: null         # e.g. ~/piper/en_US-ryan-medium.onnx

chat:
  model: qwen/qwen3.8-27b            # llama-3.3-70b retired on Groq; alt: openai/gpt-oss-120b
  reasoning_effort: low              # gpt-oss/qwen reasoning models; null for non-reasoning models
  temperature: 0.75
  max_tokens: 600                    # includes hidden reasoning tokens; spoken length is set by the prompt
  history_turns: 12          # user+assistant pairs kept (system prompt always kept)
  humour: 75

agent:
  model: gemini-robotics-er-2-preview   # ER 1.5/1.6 are deprecated
  max_calls: 15
  max_retries_per_step: 2

camera:
  index: 0
  width: 1280
  height: 720

servo_bus:
  port: /dev/ttyACM0         # macOS: /dev/cu.usbmodem*  (Waveshare adapter)
  baudrate: 1000000
  control_hz: 50
  telemetry_hz: 5
  max_load_pct: 80           # sustained load above this -> halt
  max_temp_c: 60
  default_speed_dps: 60      # deg/s

# SO-101 joint map. offset_ticks = raw tick at joint angle 0; sign = +1/-1.
# Limits are in joint degrees AFTER offset/sign. Fill in during bring-up.
joints:
  - {name: shoulder_pan,  id: 1, offset_ticks: 2048, sign: 1,  min_deg: -110, max_deg: 110}
  - {name: shoulder_lift, id: 2, offset_ticks: 2048, sign: 1,  min_deg: -100, max_deg: 100}
  - {name: elbow_flex,    id: 3, offset_ticks: 2048, sign: 1,  min_deg: -100, max_deg: 100}
  - {name: wrist_flex,    id: 4, offset_ticks: 2048, sign: 1,  min_deg: -100, max_deg: 100}
  - {name: wrist_roll,    id: 5, offset_ticks: 2048, sign: 1,  min_deg: -160, max_deg: 160}
  - {name: gripper,       id: 6, offset_ticks: 2048, sign: 1,  min_deg: 0,    max_deg: 100}

gripper:
  open_deg: 90
  closed_deg: 0

# Named poses in joint degrees (order = joints above, excluding gripper).
named_poses:
  home: [0, -90, 90, 0, 0]
  scan: [0, -40, 60, 70, 0]

# Named drop-off spots on the table, base frame metres [x, y]. +y = robot's left.
locations:
  center: [0.22, 0.0]
  left: [0.20, 0.15]
  right: [0.20, -0.15]

workspace:
  table_z_m: 0.0             # table plane height in base frame
  min_radius_m: 0.08
  max_radius_m: 0.38
  min_z_m: 0.005
